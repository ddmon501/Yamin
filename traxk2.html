.app{
  --ink:#0C1418; --ink2:#3C5058; --muted:#7A8C93;
  --paper:#EFF3F2; --card:#FFFFFF; --line:#DBE4E3; --line2:#EAF0EF;
  --slate:#14242A; --slate2:#1E353D; --graphite:#5A7079;
  --teal:#0F7A82; --fam:#2F6BE0; --hex:#17A06B; --hex-deep:#0F7A55; --rox:#DE4B34; --tam:#E0952A;
  --r:10px;
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--paper);
  min-height:100vh; display:grid; grid-template-columns:212px 1fr; grid-template-rows:56px 1fr;
  grid-template-areas:"rail top" "rail main";
  font-size:14px; -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box}
.app button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app input,.app select,.app textarea{font-family:inherit;font-size:13px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.app input:focus,.app select:focus,.app textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,122,130,.13)}
.app :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.strong{font-weight:600} .muted{color:var(--muted)} .small{font-size:11px}
.red{color:var(--rox)} .amber{color:var(--tam)} .green{color:var(--hex-deep)}
h1,h2{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:17px} h2{font-size:14px}

/* rail */
.rail{grid-area:rail;background:var(--slate);color:#CFE0E2;display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}
.brand-mark{display:grid;grid-template-columns:3px 3px 3px 3px;gap:2px;align-items:end;height:22px}
.brand-mark span{width:3px;border-radius:1px}
.brand-mark span:nth-child(1){height:22px;background:var(--fam)}
.brand-mark span:nth-child(2){height:13px;background:var(--hex)}
.brand-mark span:nth-child(3){height:18px;background:var(--tam)}
.brand-mark span:nth-child(4){height:9px;background:var(--rox)}
.brand-txt b{font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:.14em;color:#fff;display:block;line-height:1}
.brand-txt i{font-style:normal;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7FA0A5}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;color:#A9C2C6;text-align:left;transition:.15s}
.rail-btn:hover{background:var(--slate2);color:#fff}
.rail-btn.on{background:var(--slate2);color:#fff;box-shadow:inset 2px 0 0 var(--teal)}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
.rail-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6E9096;display:block;margin-bottom:5px}
.who{width:100%;background:var(--slate2);border-color:rgba(255,255,255,.12);color:#DCEAEB;font-size:11.5px;padding:7px 8px}

/* topbar */
.topbar{grid-area:top;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.tb-right{display:flex;align-items:center;gap:12px}
.ghost{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;color:var(--ink2);font-size:13px}
.ghost:hover{background:var(--line2)}
.bell{position:relative}
.bell em{position:absolute;top:1px;right:1px;background:var(--rox);color:#fff;font-style:normal;font-size:9px;
  min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px;font-weight:600}
.ava{background:var(--slate2);color:#DDEDEE;border-radius:50%;display:inline-grid;place-items:center;
  font-weight:600;letter-spacing:.03em;flex:none;font-family:'IBM Plex Mono',monospace}

/* layout */
.main{grid-area:main;padding:18px;overflow-y:auto}
.stack{display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto;padding-bottom:40px}
.stack-sm{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabbar{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 15px 0}
.card-h p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.card-b{padding:13px 15px 15px}
.foot{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.empty{font-size:12.5px;color:var(--muted);margin:6px 0;line-height:1.6}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--graphite)}
.kpi-warn:before{background:var(--tam)} .kpi-late:before{background:var(--rox)} .kpi-ok:before{background:var(--hex)}
.kpi-label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.kpi-val{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.kpi-val i{font-style:normal;font-size:13px;color:var(--muted);margin-left:2px}
.kpi-sub{font-size:11px;color:var(--muted)}

/* the signature: stage track */
.track{display:flex;gap:3px;align-items:flex-end;height:26px}
.track-c{height:12px;gap:2px}
.lane{flex:1;border-radius:2px;position:relative;background:var(--line2);height:12px;transition:.2s}
.track:not(.track-c) .lane{height:14px}
.lane-done{background:var(--lane);opacity:.42}
.lane-cur{background:var(--lane);height:22px !important;box-shadow:0 0 0 2px rgba(15,122,130,.14)}
.track-c .lane-cur{height:12px !important}
.lane-late.lane-cur{background:var(--rox);box-shadow:0 0 0 2px rgba(222,75,52,.18)}
.lane-tick{position:absolute;left:0;right:0;bottom:-11px;text-align:center;font-size:7px;color:var(--ink2)}
.track-legend{display:flex;gap:3px;margin-top:14px}
.track-legend span{flex:1;font-size:8.5px;text-align:center;color:var(--muted);line-height:1.25;
  text-transform:uppercase;letter-spacing:.04em}
.track-legend .on{color:var(--ink);font-weight:600}
.track-legend .past{color:var(--ink2)}

/* charts */
.ladder{display:flex;flex-direction:column;gap:7px}
.ladder-row{display:grid;grid-template-columns:118px 1fr 26px;gap:9px;align-items:center}
.ladder-label{font-size:11.5px;color:var(--ink2);text-align:right}
.ladder-bar{background:var(--line2);border-radius:3px;height:15px;overflow:hidden}
.ladder-fill{height:100%;border-radius:3px;transition:width .4s}
.ladder-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.cols{width:100%;display:block}
.axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:5px;font-family:'IBM Plex Mono',monospace}
.paired{display:flex;flex-direction:column;gap:8px}
.paired-row{display:grid;grid-template-columns:112px 1fr 74px;gap:9px;align-items:center}
.paired-label{font-size:11.5px;color:var(--ink2);text-align:right}
.paired-track{position:relative;height:16px}
.paired-target{position:absolute;top:0;bottom:0;background:var(--line2);border-right:2px solid var(--graphite);border-radius:3px 0 0 3px}
.paired-actual{position:absolute;top:4px;bottom:4px;background:var(--teal);border-radius:2px}
.paired-actual.over{background:var(--rox)}
.paired-val{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:right}
.load{display:flex;flex-direction:column;gap:9px}
.load-row{display:grid;grid-template-columns:26px 1fr 1.3fr auto;gap:9px;align-items:center}
.load-name{font-size:12px;line-height:1.2}
.load-name i{display:block;font-style:normal;font-size:10px;color:var(--muted)}
.load-bar{position:relative;height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.load-fill{position:absolute;inset:0 auto 0 0;background:var(--fam);opacity:.72}
.load-late{position:absolute;inset:0 auto 0 0;background:var(--rox)}
.load-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.load-val em{font-style:normal;font-size:10px;color:var(--rox)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line2);
  font-size:12.5px;text-align:left;width:100%}
.row:last-child{border-bottom:none}
.row:not(.static):hover{background:var(--line2)}
.row-mid{flex:1;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot-ok{background:var(--hex)} .dot-warn{background:var(--tam)} .dot-late{background:var(--rox)}
.pill{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  background:var(--line2);color:var(--ink2);font-weight:600;white-space:nowrap}
.pill-warn{background:#FBF0DC;color:#8A5C10} .pill-late{background:#FBE3DE;color:#9A2E1B}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:230px;display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--muted)}
.search input{border:none;flex:1;padding:9px 0;background:none}
.search input:focus{box-shadow:none}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.count{font-size:11.5px;color:var(--muted);margin:0}
.linkish{color:var(--teal);font-size:11.5px;text-decoration:underline;margin-left:8px}
.btn{background:var(--teal);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.btn:hover{background:#0C666D} .btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.wide{width:100%} .big-btn{padding:14px;font-size:14px;flex:1}
.btn-ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;
  font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{border-color:var(--ink2)}

/* table */
.tbl{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow-late{border-left:3px solid var(--rox)} .trow-warn{border-left:3px solid var(--tam)}
.trow-ok{border-left:3px solid var(--line)}
.trow-main{flex:1;display:grid;grid-template-columns:186px 1.25fr 150px 210px;gap:12px;align-items:center;
  padding:11px 13px;text-align:left}
.trow-main:hover{background:var(--line2)}
.trow-id{display:flex;align-items:center;gap:7px}
.trow-meta{display:flex;gap:6px;font-size:12px;align-items:center;flex-wrap:wrap}
.sep{color:var(--line)}
.trow-tail{display:flex;align-items:center;gap:9px;justify-content:flex-end;font-size:11.5px}
.stage-name{font-size:11.5px;color:var(--ink2);font-weight:500}
.quick{width:42px;border-left:1px solid var(--line2);color:var(--teal);display:grid;place-items:center}
.quick:hover{background:var(--teal);color:#fff}

/* detail */
.det-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.det-id{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.det-head h2{font-size:19px;margin:5px 0 3px}
.det-sub{font-size:12.5px;color:var(--muted);margin:0}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line2)}
.statline label{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.statline b{font-size:13px;font-family:'IBM Plex Mono',monospace}
.advance{margin-top:13px;display:flex;flex-direction:column;gap:9px}
.advance textarea{width:100%;resize:vertical}
.adv-foot{display:flex;gap:9px;align-items:center}
.attach{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  border:1px dashed var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;white-space:nowrap}
.attach input{display:none}
.assign{margin-top:13px;padding-top:12px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.assign label{font-size:11.5px;color:var(--muted)}
.assign i{font-size:11px;font-style:normal}
.done-note{display:flex;gap:8px;align-items:center;margin-top:13px;padding:11px;border-radius:8px;
  background:#E7F5EE;color:var(--hex-deep);font-size:12.5px}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;position:relative;max-height:420px;overflow-y:auto}
.timeline:before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.timeline li{position:relative;padding:0 0 15px 6px}
.tl-dot{position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--lane);
  box-shadow:0 0 0 3px var(--card)}
.tl-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.tl-top span{font-size:11px;font-family:'IBM Plex Mono',monospace}
.tl-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);margin-top:4px}
.tl-note{font-size:11.5px;background:var(--line2);border-radius:6px;padding:7px 9px;margin:6px 0 0;line-height:1.5}
.tl-file{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--teal);margin-top:5px;font-family:'IBM Plex Mono',monospace}
.dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.dl dt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:2px 0 0;font-size:12.5px}

/* scan */
.scan{max-width:640px}
.scanbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.viewfinder{border:1.5px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;color:var(--ink2);
  background:linear-gradient(180deg,#FBFDFC,#F3F7F6)}
.viewfinder p{margin:9px 0 5px;font-size:14px}
.viewfinder span{font-size:11.5px;color:var(--muted);line-height:1.6;display:block;max-width:400px;margin:0 auto}
.scan-input{display:flex;gap:8px;margin-top:14px}
.scan-input input{flex:1;font-size:15px;letter-spacing:.05em;padding:12px}
.err{display:flex;align-items:center;gap:6px;color:var(--rox);font-size:12px;margin:10px 0 0}
.recent{margin-top:15px}
.recent label{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11.5px;background:var(--card)}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.hit{border-color:var(--teal);box-shadow:0 6px 22px -14px rgba(12,20,24,.5)}
.hit-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hit-top p{margin:3px 0 0;font-size:12px}
.big{font-size:17px}
.hit-actions{display:flex;gap:9px;margin-top:15px;align-items:center;flex-wrap:wrap}

/* register */
.form{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field textarea{resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:6px 11px;font-size:11.5px;cursor:pointer;background:var(--card)}
.checks label.on{border-color:var(--teal);background:#E9F4F4;color:#0B5A60;font-weight:500}
.checks input{display:none}
.reg-done{display:flex;gap:8px;align-items:center;background:#E7F5EE;color:var(--hex-deep);
  padding:11px;border-radius:8px;font-size:12.5px}

/* label */
.label{border:1px solid var(--line);border-radius:6px;padding:11px;background:#fff;max-width:330px}
.label-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;
  text-transform:uppercase;letter-spacing:.06em}
.bc{margin:3px 0}
.bc-text{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.19em;margin-top:3px}
.label-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:9.5px;color:var(--ink2);margin-top:7px}

/* audit */
.audit-head,.audit-row{display:grid;grid-template-columns:130px 148px 130px 1fr 130px 130px;gap:10px;
  padding:9px 15px;align-items:center;font-size:12px}
.audit-head{background:var(--line2);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.audit-row{border-bottom:1px solid var(--line2)}
.audit-body{max-height:600px;overflow-y:auto}
.ar-user{display:flex;align-items:center;gap:6px}

/* settings */
.cfg{display:flex;flex-direction:column;gap:5px}
.cfg-row{display:grid;grid-template-columns:4px 1fr 1.4fr 108px;gap:11px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line2)}
.cfg-swatch{height:26px;border-radius:2px;background:var(--lane)}
.cfg-name{font-size:12.5px;font-weight:500}
.cfg-name i{display:block;font-style:normal;font-size:10px;color:var(--muted);font-weight:400}
.cfg-roles{display:flex;gap:4px;flex-wrap:wrap}
.cfg-days{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.cfg-days input{width:62px;text-align:right;font-family:'IBM Plex Mono',monospace}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li b{font-size:12.5px;display:block}
.rules li span{font-size:11.5px;color:var(--muted);line-height:1.5}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(12,20,24,.42);display:grid;place-items:center;z-index:60;padding:18px}
.modal.right{place-items:stretch;justify-content:flex-end;padding:0}
.sheet{background:var(--card);border-radius:12px;max-width:400px;width:100%;overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line2)}
.sheet-h>div{display:flex;align-items:center;gap:4px}
.sheet .label{margin:15px auto}
.sheet-note{font-size:11px;color:var(--muted);padding:0 15px;line-height:1.6}
.sheet-foot{padding:15px;display:flex;justify-content:flex-end}
.drawer{background:var(--card);width:min(380px,100%);height:100%;display:flex;flex-direction:column;
  animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(22px);opacity:.4}to{transform:none;opacity:1}}
.drawer-b{overflow-y:auto;padding:8px}
.notif{display:flex;gap:10px;text-align:left;padding:11px;border-radius:8px;width:100%;align-items:flex-start}
.notif:hover{background:var(--line2)}
.notif.read{opacity:.5}
.notif b{font-size:12.5px;display:block;line-height:1.35}
.notif span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
.notif i{font-size:10px;color:var(--muted);font-style:normal;display:block;margin-top:4px;font-family:'IBM Plex Mono',monospace}
.notif-overdue>svg{color:var(--rox)} .notif-stuck>svg{color:var(--tam)}
.notif-completed>svg{color:var(--hex)} .notif-assigned>svg{color:var(--fam)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--slate);color:#fff;
  padding:11px 18px;border-radius:22px;font-size:12.5px;z-index:80;box-shadow:0 8px 26px -10px rgba(0,0,0,.5)}
.boot{height:100vh;display:grid;place-items:center;gap:12px;font-family:'IBM Plex Sans',sans-serif;
  color:#5A7079;font-size:12.5px;background:#EFF3F2}
.boot-bar{width:150px;height:3px;background:#DBE4E3;border-radius:2px;overflow:hidden;position:relative}
.boot-bar:after{content:'';position:absolute;inset:0;width:40%;background:#0F7A82;animation:sweep 1s infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* responsive */
@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .trow-main{grid-template-columns:170px 1fr 120px}
  .trow-main>*:nth-child(4){display:none}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-areas:"top" "main";padding-bottom:62px}
  .rail{display:none}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .main{padding:12px}
  .trow-main{grid-template-columns:1fr;gap:8px}
  .hide-s{display:none}
  .statline{grid-template-columns:1fr 1fr}
  .frow{grid-template-columns:1fr}
  .audit-head{display:none}
  .audit-row{grid-template-columns:1fr 1fr;gap:4px;padding:11px 13px}
  .track-legend{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--slate);border-top:1px solid rgba(255,255,255,.08)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:#87A6AB;font-size:9.5px}
  .tabbar button.on{color:#fff}
  .tabbar button.on svg{color:var(--teal)}
  .adv-foot{flex-direction:column;align-items:stretch}
  .det-head{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.app *{animation:none !important;transition:none !important}}
@media print{
  .rail,.topbar,.tabbar,.sheet-foot,.sheet-note,.sheet-h{display:none !important}
  .app{display:block;background:#fff} .modal{position:static;background:none;display:block}
  .sheet{box-shadow:none;max-width:none}
}

/* zxing camera */
.zx-stage{position:relative;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#0C1418;aspect-ratio:4/3;max-height:360px}
.zx-stage.off{border-style:dashed}
.zx-stage video{display:block;width:100%;height:100%;object-fit:cover;background:#0C1418}
.zx-stage.off video{opacity:0}
.zx-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  text-align:center;padding:22px;color:var(--ink2);background:linear-gradient(180deg,#FBFDFC,#F3F7F6)}
.zx-cover b{font-size:14px;color:var(--ink)}
.zx-cover span{font-size:11.5px;color:var(--muted);line-height:1.6;max-width:400px}
.zx-cover .btn{margin-top:4px}
.zx-frame{position:absolute;inset:16% 12%;border-radius:8px;pointer-events:none;
  box-shadow:0 0 0 2000px rgba(12,20,24,.42);border:2px solid rgba(255,255,255,.55)}
.zx-frame:after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--teal);
  box-shadow:0 0 10px var(--teal);animation:zxsweep 2.1s ease-in-out infinite}
@keyframes zxsweep{0%{top:8%}50%{top:92%}100%{top:8%}}
.zx-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.zx-bar select{flex:1 1 150px;min-width:0}
.zx-live{font-size:11.5px;color:var(--muted);margin-left:auto}
